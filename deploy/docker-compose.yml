services:
  pm:
    build:
      context: ..
      dockerfile: Dockerfile
    image: iteration-hub-pm:latest
    container_name: pm
    restart: unless-stopped
    ports:
      - "${PM_PORT:-8787}:8787"
    # entrypoint 按 PUID/PGID 动态建 passwd 条目并 su-exec 降权，
    # 这样 /data 文件归 NAS 用户，ssh 也能查到 uid 对应的用户
    environment:
      PM_TOKEN: "${PM_TOKEN:?set PM_TOKEN in deploy/.env}"
      GIT_SSH_COMMAND: "ssh -i /ssh/id_ed25519 -o UserKnownHostsFile=/ssh/known_hosts -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
      GIT_AUTHOR_NAME: "${GIT_NAME:-pm}"
      GIT_AUTHOR_EMAIL: "${GIT_EMAIL:-pm@localhost}"
      GIT_COMMITTER_NAME: "${GIT_NAME:-pm}"
      GIT_COMMITTER_EMAIL: "${GIT_EMAIL:-pm@localhost}"
      GIT_REMOTE: "${GIT_REMOTE:-}"
      HOME: /tmp
    volumes:
      # iteration-hub 是服务仓；这里挂载的是你的 roadmap 数据仓
      - "${ROADMAP:?set ROADMAP in deploy/.env}:/data"
      # pm-wish 的 deploy key 目录（含 id_ed25519 + known_hosts），只读挂载
      - "${PM_SSH_DIR:?set PM_SSH_DIR in deploy/.env}:/ssh:ro"
